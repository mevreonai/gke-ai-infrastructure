apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-epp-config
  namespace: default
data:
  config.yaml: |
    apiVersion: inference.networking.x-k8s.io/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: no-hit-lru-scorer
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
      - pluginRef: no-hit-lru-scorer
        weight: 2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-d-epp-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-d-epp-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["inference.networking.k8s.io"]
  resources: ["inferencepools", "inferencepools/status"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["inference.networking.x-k8s.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-d-epp-rolebinding
subjects:
- kind: ServiceAccount
  name: llm-d-epp-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: llm-d-epp-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-epp
  namespace: default
  labels:
    app: llm-d-epp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-epp
  template:
    metadata:
      labels:
        app: llm-d-epp
    spec:
      serviceAccountName: llm-d-epp-sa
      containers:
      - name: epp
        image: registry.k8s.io/gateway-api-inference-extension/epp:v1.5.0
        imagePullPolicy: IfNotPresent
        args:
        - --pool-name=vllm-gpu-inference-pool
        - --pool-namespace=default
        - --grpc-port=9090
        - --metrics-port=8081
        - --grpc-health-port=9003
        - --secure-serving=false
        - -v=2
        ports:
        - name: grpc-extproc
          containerPort: 9090
          protocol: TCP
        - name: metrics
          containerPort: 8081
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: 1Gi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/epp
      volumes:
      - name: config-volume
        configMap:
          name: llm-d-epp-config
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-epp-service
  namespace: default
  labels:
    app: llm-d-epp
spec:
  selector:
    app: llm-d-epp
  type: ClusterIP
  ports:
  - name: grpc-extproc
    protocol: TCP
    port: 9090
    targetPort: 9090
  - name: metrics
    protocol: TCP
    port: 8081
    targetPort: 8081
