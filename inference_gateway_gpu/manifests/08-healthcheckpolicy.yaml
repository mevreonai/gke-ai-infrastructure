apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: vllm-gpu-health-check-policy
  namespace: default
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: vllm-gpu-service
