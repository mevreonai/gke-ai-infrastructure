apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: vllm-tpu-inference-pool
  namespace: default
spec:
  appProtocol: http
  selector:
    matchLabels:
      app: vllm-tpu-model-server
  targetPorts:
  - number: 8000
  endpointPickerRef:
    name: llm-d-epp-service
    port:
      number: 9090
    failureMode: FailOpen
