apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-routing-proxy
  namespace: default
  labels:
    app: llm-d-routing-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-routing-proxy
  template:
    metadata:
      labels:
        app: llm-d-routing-proxy
    spec:
      containers:
      - name: proxy
        image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.5.0
        env:
        - name: PREFILL_BACKEND_URL
          value: "http://vllm-prefill-service:8200"
        - name: DECODE_BACKEND_URL
          value: "http://vllm-decode-service:8200"
        - name: CONNECTOR
          value: "nixlv2"
        - name: PROXY_PORT
          value: "8000"
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "500m"
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-router-service
  namespace: default
  labels:
    app: llm-d-routing-proxy
spec:
  selector:
    app: llm-d-routing-proxy
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000
