apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: disaggregated-tpu-gateway
  namespace: default
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: disaggregated-tpu-route
  namespace: default
spec:
  parentRefs:
  - name: disaggregated-tpu-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: llm-d-router-service
      port: 8000
